name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # Apple Silicon runner: cgo against Virtualization.framework needs macOS.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - run: make tools
      - run: make ci
      - run: make build
